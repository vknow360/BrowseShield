<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShieldBrowse Dashboard</title>
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="shield-icon">🛡️</span>
      <h1>ShieldBrowse</h1>
    </div>
    <span id="status-badge" class="badge ready">Ready</span>
  </header>

  <main class="content">
    <!-- PII Detection Overview -->
    <section class="card">
      <div class="card-header">
        <h2>🔒 Detected Sensitive Data (PII)</h2>
        <span id="pii-count-badge" class="count-badge">0 Found</span>
      </div>
      <p class="desc">Client-side mathematical checksum & regex detection:</p>

      <div id="pii-list" class="pii-list-container">
        <p class="empty-state">No PII detected on active page.</p>
      </div>
    </section>

    <!-- Raw Data Stream (Collapsible or secondary) -->
    <section class="card">
      <h2>📡 Live DOM Stream</h2>
      <pre id="output-box" class="code-box">Waiting for webpage scan...</pre>
    </section>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
