<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowseShield Dashboard</title>
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="shield-icon">🛡️</span>
      <h1>BrowseShield</h1>
    </div>
    <span id="status-badge" class="badge ready">Ready</span>
  </header>

  <main class="content">
    <!-- Agent Control Panel -->
    <section class="card">
      <div class="card-header">
        <h2>🤖 Agent Task</h2>
      </div>
      <input type="text" id="task-instruction" class="task-input" placeholder="e.g., Fill out this form"
        value="Fill out this form" />
      <button id="run-agent-btn" class="primary-btn">Run Agent</button>
      <div id="agent-status" class="agent-status-text">Idle</div>
    </section>

    <!-- PII Detection Overview -->
    <section class="card">
      <div class="card-header">
        <h2>🔒 Detected Sensitive Data (PII)</h2>
        <span id="pii-count-badge" class="count-badge">0 Found</span>
      </div>
      <p class="desc">Client-side mathematical checksum & regex detection:</p>

      <div id="pii-list" class="pii-list-container">
        <p class="empty-state">No PII detected on active page.</p>
      </div>
    </section>

    <!-- What Server Sees (Sanitized Payload) -->
    <section class="card">
      <div class="card-header">
        <h2>📡 What the server sees</h2>
        <span id="gate-badge" class="badge ready">🔒 GATE: IDLE</span>
      </div>
      <div id="vlm-preview-container" style="display: none; margin-bottom: 10px;">
        <img id="vlm-redacted-image" style="max-width: 100%; border: 1px solid #3d4b60; border-radius: 4px;"
          alt="Redacted Screenshot" />
      </div>
      <pre id="output-box" class="code-box">Waiting for webpage scan...</pre>
      <button id="export-audit-btn" class="primary-btn" style="margin-top: 10px;">📄 Export Audit Report</button>
    </section>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
